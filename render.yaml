services:
  # 1. Web Application Service (Runs Gunicorn + Celery in background)
  - type: web
    name: taskflow
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "celery -A todo_desktop worker --beat --loglevel=info --detach && gunicorn todo_desktop.wsgi:application"
    healthCheckPath: "/ht/"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: taskflow-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: taskflow-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_ADMIN_EMAIL
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

  # 2. Managed Redis (Key-Value Cache & Queue)
  - type: redis
    name: taskflow-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

# 3. Managed PostgreSQL Database
databases:
  - name: taskflow-db
    plan: free
    databaseName: taskflow
    user: taskflow_user
