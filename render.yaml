services:
  # 1. Web Application Service
  - type: web
    name: taskflow
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn todo_desktop.wsgi:application"
    healthCheckPath: "/ht/"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: taskflow-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: taskflow-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

  # 2. Celery Background Worker & Beat Scheduler
  - type: worker
    name: taskflow-worker
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A todo_desktop worker --beat --loglevel=info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        fromService:
          type: web
          name: taskflow
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: taskflow-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: taskflow-redis
          property: connectionString

# 3. Managed PostgreSQL Database
databases:
  - name: taskflow-db
    databaseName: taskflow
    user: taskflow_user
    plan: starter

# 4. Managed Redis Cache & Queue
redis:
  - name: taskflow-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
