{% extends 'base.html' %}

{% block title %}
New Category - TaskFlow
{% endblock %}

{% block page_title %}
New Category
{% endblock %}

{% block content %}
<div class="form-page">
    <div class="glass-card form-card narrow">
        <form method="post" class="category-form">
            {% csrf_token %}
            <div class="form-group">
                <label>Name</label>
                {{ form.name }}
            </div>
            <div class="form-row two-col">
                <div class="form-group">
                    <label>Color</label>
                    {{ form.color }}
                </div>
                <div class="form-group">
                    <label>Icon (FontAwesome class)</label>
                    {{ form.icon }}
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Create Category</button>
                <a href="{% url 'category_list' %}" class="btn btn-ghost">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
